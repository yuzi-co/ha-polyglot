name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly, to catch Home Assistant or HACS rule changes
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Until the repository is public and in the brands repo; remove these then.
          ignore: brands
